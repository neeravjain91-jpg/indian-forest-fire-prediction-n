[project]
name = "indian-forest-fire-prediction-n"
version = "1.0.0"
description = "India Forest Fire Occurrence Prediction using Multi-Timescale Meteorological Features"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "joblib>=1.4",
    "shapely>=2.0",
    "pytest>=8.0",
]

[tool.vercel]
entrypoint = "application:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
